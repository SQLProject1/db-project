<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">← Zurück</a>
    </div>
</nav>

<div class="container mt-4">
    <h1>{{ title }}</h1>
<form method="get" class="row g-2 mb-3">
    <div class="col-md-4">
        <select name="column" class="form-select">
            <option value="">Spalte auswählen</option>
            {% for col in columns %}
                <option value="{{ col }}" {% if col == search_col %}selected{% endif %}>
                    {{ col }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="col-md-4">
        <input
            type="text"
            name="q"
            class="form-control"
            placeholder="Suchbegriff"
            value="{{ search_val or '' }}"
        >
    </div>

    <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">
            Suchen
        </button>
    </div>

    <div class="col-md-2">
        <a href="?" class="btn btn-secondary w-100">
            Reset
        </a>
    </div>
</form>

    {% if rows %}
        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    {% for key in rows[0].keys() %}
                        <th>{{ key }}</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody>
                {% for row in rows %}
                    <tr>
                        {% for value in row.values() %}
                            <td>{{ value }}</td>
                        {% endfor %}
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>Keine Einträge vorhanden.</p>
    {% endif %}
</div>

</body>
</html>
